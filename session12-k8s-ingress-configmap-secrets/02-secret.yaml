# A Secret is the same shape as a ConfigMap, but for sensitive values.
#   stringData -> written in plain text, Kubernetes base64-encodes it for you
#   data       -> you supply the base64 yourself
# NOTE: base64 is ENCODING, not encryption. Anyone with get-secret RBAC can read it.
apiVersion: v1
kind: Secret
metadata:
  name: yatri-secret
type: Opaque
stringData:
  DB_USERNAME: "yatri_admin"
  DB_PASSWORD: "S3cr3t-P@ssw0rd"
data:
  # echo -n 'api-key-1234567890' | base64
  API_KEY: YXBpLWtleS0xMjM0NTY3ODkw
