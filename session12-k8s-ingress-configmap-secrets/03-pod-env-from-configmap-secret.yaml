# Injecting config as ENVIRONMENT VARIABLES.
#   envFrom     -> pull in EVERY key at once
#   valueFrom   -> pull in one key, optionally under a different name
apiVersion: v1
kind: Pod
metadata:
  name: config-env-demo
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "--- from the ConfigMap (envFrom, only the scalar keys) ---"
          echo "APP_NAME  = $APP_NAME"
          echo "APP_ENV   = $APP_ENV"
          echo "LOG_LEVEL = $LOG_LEVEL"
          echo
          echo "--- from the Secret (individually, renamed) ---"
          echo "DB_USER   = $DB_USER"
          echo "DB_PASS   = $DB_PASS"
          echo "API_KEY   = $API_KEY"
      envFrom:
        - configMapRef:
            name: yatri-config
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: yatri-secret
              key: DB_USERNAME
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: yatri-secret
              key: DB_PASSWORD
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: yatri-secret
              key: API_KEY
