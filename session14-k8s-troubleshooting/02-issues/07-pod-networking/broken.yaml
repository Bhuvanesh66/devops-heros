# Pod networking problem: the app binds to 127.0.0.1, so it only answers INSIDE its own
# network namespace. Other Pods (and the Service) reach the Pod IP and are refused.
apiVersion: v1
kind: Pod
metadata:
  name: inventory
  labels: { app: inventory }
spec:
  containers:
    - name: api
      image: python:3.11-alpine
      command: ["python3", "-m", "http.server", "8080", "--bind", "127.0.0.1"]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector: { app: inventory }
  ports:
    - port: 80
      targetPort: 8080
