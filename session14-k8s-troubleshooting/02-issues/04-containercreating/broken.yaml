# Stuck in ContainerCreating: the Pod mounts a ConfigMap that does not exist,
# so the kubelet can never set up the volume and never starts the container.
apiVersion: v1
kind: Pod
metadata:
  name: report-worker
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "cat /etc/report/settings.ini; sleep 3600"]
      volumeMounts:
        - name: settings
          mountPath: /etc/report
  volumes:
    - name: settings
      configMap:
        name: report-settings        # <- never created
