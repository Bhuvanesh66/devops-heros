# V1 - the baseline Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  annotations:
    kubernetes.io/change-cause: "V1: initial rollout - nginx:1.25-alpine"
  labels:
    app: yatri-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yatri-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: yatri-backend
        version: v1
    spec:
      containers:
        - name: backend
          image: nginx:1.25-alpine      # V1 image
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
