# 04 — restartPolicy: Always (the default) with a container that always fails.
# Expected end state: CrashLoopBackOff, with RESTARTS climbing and the backoff
# doubling 10s -> 20s -> 40s ... up to 5 minutes.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-04-crashloop
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting up...'; sleep 3; echo 'fatal: cannot reach database'; exit 1"]
