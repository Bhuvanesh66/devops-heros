# 11 — multi-container Pod (the sidecar pattern).
# Both containers share ONE network namespace (so 'localhost' reaches each other)
# and ONE emptyDir volume. This is the whole reason a Pod is not just a container.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-11-sidecar
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    # main app: writes a log line every 5 seconds
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"$(date +%T) app: request $i handled\" >> /var/log/app.log; sleep 5; done"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log
    # sidecar: ships the same file to stdout, where kubectl logs can see it
    - name: log-shipper
      image: busybox:1.36
      command: ["sh", "-c", "touch /var/log/app.log; tail -n +1 -f /var/log/app.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log
