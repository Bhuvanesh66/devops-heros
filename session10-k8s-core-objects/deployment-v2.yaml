# V2 - same Deployment, new image. Applying this over V1 triggers a rolling update.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  annotations:
    kubernetes.io/change-cause: "V2: upgrade to nginx:1.26-alpine"
  labels:
    app: yatri-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yatri-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: yatri-backend
        version: v2
    spec:
      containers:
        - name: backend
          image: nginx:1.26-alpine      # V2 image
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
