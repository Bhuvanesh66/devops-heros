# Scrape the TaskFlow backend's /metrics (plain-manifest deployment).
# The Helm chart renders an equivalent ServiceMonitor when serviceMonitor.enabled=true.
#   kubectl apply -f final-devops-project/monitoring/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskflow-backend
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
    # matched by kube-prometheus-stack's default selector (release: <helm release name>)
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames:
      - taskflow
  endpoints:
    - port: http # the named port of Service taskflow-backend
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
