# kube-prometheus-stack for TaskFlow on a single-node minikube/kind.
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f final-devops-project/monitoring/kube-prometheus-stack-values.yaml
prometheus:
  prometheusSpec:
    retention: 12h
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Select ServiceMonitors / PrometheusRules from every namespace, with or
    # without the "release" label, so the TaskFlow objects are always picked up.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits: { memory: 800Mi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

grafana:
  # Set the admin password at install time instead of committing one:
  #   --set grafana.adminPassword="$(openssl rand -base64 18)"
  # or read the generated one:
  #   kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}' | base64 -d
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # load the TaskFlow dashboard ConfigMap from the app namespace too
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }

# minikube does not expose these control-plane metrics endpoints
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
