# Issue 2 - the ConfigMap points the backend at a database host that does not exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../lab-base
patches:
  - target:
      kind: ConfigMap
      name: taskflow-config
    patch: |-
      - op: replace
        path: /data/DB_HOST
        value: taskflow-postgresql
