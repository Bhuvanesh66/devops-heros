{{- if .Values.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar (kube-prometheus-stack) because of the
# grafana_dashboard label. The JSON lives in files/taskflow-dashboard.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.fullname" . }}-grafana-dashboard
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  taskflow-dashboard.json: |-
    {{- .Files.Get "files/taskflow-dashboard.json" | nindent 4 }}
{{- end }}
