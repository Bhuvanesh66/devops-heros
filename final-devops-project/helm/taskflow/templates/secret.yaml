{{- if not .Values.database.existingSecret }}
{{- /* Created only when no existingSecret is given. The password must be supplied
       (values-dev.yaml has a demo-only placeholder; CI passes a random one). */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.secretName" . }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER: {{ .Values.database.user | b64enc | quote }}
  DB_PASSWORD: {{ required "set database.password (or database.existingSecret)" .Values.database.password | b64enc | quote }}
{{- end }}
