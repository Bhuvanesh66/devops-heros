# nginx server block for the TaskFlow UI.
# Installed as /etc/nginx/templates/default.conf.template; ${BACKEND_URL} is
# replaced at container start (all other $variables are nginx's own).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness/readiness probe for the frontend container itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API: the browser calls /api/..., nginx forwards it unchanged.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
