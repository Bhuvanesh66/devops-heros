# Plain-manifest deployment of TaskFlow:
#   kubectl apply -k final-devops-project/kubernetes
# Pin the images to a commit SHA by changing newTag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskflow
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml # demo-only placeholder values, see the comment inside
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
images:
  - name: ghcr.io/bhuvanesh66/final-taskflow-backend
    newTag: latest
  - name: ghcr.io/bhuvanesh66/final-taskflow-frontend
    newTag: latest
