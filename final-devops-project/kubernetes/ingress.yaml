# One host, two paths: /api goes straight to the backend Service, everything
# else to the frontend. Needs the ingress-nginx controller
# (minikube: `minikube addons enable ingress`) and a hosts-file entry
#   <ingress IP>  taskflow.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/part-of: taskflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: taskflow.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow-frontend
                port:
                  name: http
