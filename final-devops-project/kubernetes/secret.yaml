# DEMO-ONLY placeholder values so `kubectl apply -k` works on a throw-away cluster.
# Do not reuse them. For any real cluster delete this file from kustomization.yaml
# and create the Secret out of band instead, e.g.
#
#   kubectl -n taskflow create secret generic taskflow-db \
#     --from-literal=DB_USER=taskflow \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)"
#
# Keys: DB_USER / DB_PASSWORD are read by the backend and mapped to
# POSTGRES_USER / POSTGRES_PASSWORD for the PostgreSQL container.
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-db
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  DB_USER: taskflow
  DB_PASSWORD: demo-only-change-me
