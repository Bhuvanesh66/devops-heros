# React UI on nginx-unprivileged (UID 101, port 8080). nginx also proxies /api
# to the backend Service named in BACKEND_URL (ConfigMap taskflow-config).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: taskflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/bhuvanesh66/final-taskflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: BACKEND_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx writes its pid and temp files to /tmp and renders the
            # BACKEND_URL template to /tmp/default.conf at start-up.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-frontend
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: taskflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
