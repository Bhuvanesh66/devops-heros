# Horizontal Pod Autoscalers (autoscaling/v2). They need metrics-server
# (minikube: `minikube addons enable metrics-server`) and CPU requests on the
# target containers, because utilization is measured against the request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskflow-backend
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: taskflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskflow-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskflow-frontend
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: taskflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskflow-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
