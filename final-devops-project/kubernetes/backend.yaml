# FastAPI backend: 2+ replicas, migrations in an initContainer, three probes,
# requests/limits (needed by the HPA), hardened security context.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: taskflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Waits for PostgreSQL, then runs `alembic upgrade head`. alembic/env.py
        # takes a PostgreSQL advisory lock, so pods starting together are safe.
        - name: migrate
          image: ghcr.io/bhuvanesh66/final-taskflow-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.prestart"]
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: ghcr.io/bhuvanesh66/final-taskflow-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db
                  key: DB_PASSWORD
          # startup: time to boot; liveness: the process answers HTTP;
          # readiness: only route traffic while the database answers (/ready).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-backend
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: taskflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
