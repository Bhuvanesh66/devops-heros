# The yatri-backend application code. A tiny Python HTTP server on port 5000
# (the targetPort used by the class's backend-service.yaml):
#   /healthz -> cheap, used by the probes
#   /        -> does real CPU work per request, so load turns into CPU usage
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-backend-code
  labels:
    app: yatri-backend
data:
  server.py: |
    import math, os, socket
    from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/healthz"):
                body = b"ok\n"
            else:
                total = sum(math.sqrt(i) for i in range(150_000))   # ~CPU work
                body = f"yatri-backend pod={socket.gethostname()} result={total:.0f}\n".encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):   # keep the logs quiet under load
            pass

    ThreadingHTTPServer(("", 5000), Handler).serve_forever()
