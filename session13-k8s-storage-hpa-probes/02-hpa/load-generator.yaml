# In-cluster load generator: 3 busybox Pods, each looping wget against the Service.
# Running it inside the cluster avoids port-forward becoming the bottleneck
# (the class's load_generator.sh drives the same Service through a port-forward).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: hammer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://yatri-backend-service/ > /dev/null; done"]
          resources:
            requests:
              cpu: 20m
              memory: 8Mi
