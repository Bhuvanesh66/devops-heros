# The Argo CD Application: "keep namespace session20 in the cluster identical to
# session20-monitoring-gitops/gitops/app on the main branch of this repository".
# Applied by hand (kubectl apply) - it lives OUTSIDE the watched app/ path on purpose.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bhuvanesh66/devops-heros.git
    targetRevision: main
    path: session20-monitoring-gitops/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: session20
  syncPolicy:
    automated:
      prune: true      # delete resources that were removed from Git
      selfHeal: true   # undo manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
